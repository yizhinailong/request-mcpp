name: Windows CI

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: Tag ref created by the version workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install mcpp
        run: ./.github/scripts/install_mcpp.ps1

      - name: Install LLVM toolchain
        run: mcpp toolchain install llvm 22.1.8

      - name: Select LLVM toolchain
        run: mcpp toolchain default llvm@22.1.8

      - name: Build
        run: mcpp build

      - name: Test
        run: mcpp test
